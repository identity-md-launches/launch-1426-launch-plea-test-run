[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
gas_limit = "1000000000"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./launch.json" }]

[profile.default.fuzz]
runs = 32

[fmt]
line_length = 120

[lint]
lint_on_build = false
